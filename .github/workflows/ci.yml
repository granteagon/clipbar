name: Build and test
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: ./scripts/build.sh --universal
      - uses: actions/upload-artifact@v4
        with:
          name: ClipBar-development
          path: dist/ClipBar.app
